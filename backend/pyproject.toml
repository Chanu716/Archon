[tool.poetry]
name = "archon-api"
version = "0.1.0"
description = "Archon Backend API"
authors = ["Archon Team <team@archon.local>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
asyncpg = "^0.29.0"
pgvector = "^0.2.5"
neo4j = "^5.18.0"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
structlog = "^24.1.0"
gitpython = "^3.1.42"
alembic = "^1.13.1"
python-multipart = "^0.0.9"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
ruff = "^0.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
